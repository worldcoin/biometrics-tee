[workspace]
members = [
    "dev/api-types",
    "dev/client",
    "dev/enclave",
    "dev/enclave-types",
    "dev/host",
    "migration/enclave",
    "migration/enclave-types",
    "migration/host",
    "migration/jobs",
    "migration/storage",
    "migration/api",
    "migration/api-client",
    "migration/cli",
    "migration/proof",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.1.0"
license = "MIT"
homepage = "https://github.com/worldcoin/di-migration-tee"
repository = "https://github.com/worldcoin/di-migration-tee"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
aws-config = "1"
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = "0.8"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
di-dev-api-types = { path = "dev/api-types" }
di-dev-enclave-types = { path = "dev/enclave-types" }
di-migration-enclave-types = { path = "migration/enclave-types" }
di-migration-jobs = { path = "migration/jobs" }
di-migration-storage = { path = "migration/storage" }
flate2 = "1.1"
http-body-util = "0.1"
mime = "0.3"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
migration-api-client = { path = "migration/api-client" }
pontifex = { version = "2.0.0", default-features = false }
proof = { path = "migration/proof" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
telemetry-batteries = { version = "0.4.1", default-features = false }
thiserror = "2"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
