[workspace]
members = [
    "selfie-enrollment/e2e",
    "selfie-enrollment/host",
    "selfie-enrollment/client",
    "selfie-enrollment/enclave",
    "selfie-enrollment/api-types",
    "selfie-enrollment/sealed-types",
    "selfie-enrollment/enclave-types",

    "dev/api-primitives",
    "dev/client",
    "dev/enclave",
    "dev/enclave-primitives",
    "dev/host",
    "migration/enclave",
    "migration/enclave-primitives",
    "migration/host",
    "migration/primitives",
    "migration/storage",
    "migration/shares",
    "migration/api",
    "migration/client",
    "migration/cli",
    "migration/proof",
    "sandbox",
    "worker-protocol",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.1.0"
license = "MIT"
homepage = "https://github.com/worldcoin/biometrics-tee"
repository = "https://github.com/worldcoin/biometrics-tee"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
aws-config = "1"
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = "0.8"
bytes = { version = "1", features = ["serde"] }
ciborium = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
di-dev-api-primitives = { path = "dev/api-primitives" }
di-dev-enclave-primitives = { path = "dev/enclave-primitives" }
di-migration-enclave-primitives = { path = "migration/enclave-primitives" }
di-migration-primitives = { path = "migration/primitives" }
di-migration-storage = { path = "migration/storage" }
di-sandbox = { path = "sandbox" }
di-worker-protocol = { path = "worker-protocol" }
sandbox-bundle = { package = "flamingo-verifier-sandbox-bundle", git = "https://github.com/worldcoin/flamingo", tag = "server/v0.1.0-rc.2" }
flate2 = "1.1"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
http-body-util = "0.1"
libc = "0.2"
mime = "0.3"
minijail = { git = "https://github.com/google/minijail", rev = "b0b5dc6997956cdc027295ade5e425c416f30d33" }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
di-migration-client = { path = "migration/client" }
pontifex = { version = "3.0.0", default-features = false }
proof = { path = "migration/proof" }
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
telemetry-batteries = { version = "0.4.1", default-features = false }
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-vsock = "0.7.2"
vsock = "0.5"
zeroize = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

selfie-enrollment-api-types = { path = "selfie-enrollment/api-types" }
selfie-enrollment-sealed-types = { path = "selfie-enrollment/sealed-types" }
selfie-enrollment-enclave-types = { path = "selfie-enrollment/enclave-types" }

selfie-enrollment-enclave = { path = "selfie-enrollment/enclave" }
biometric-engines-protocol = "0.1.0"
rand = "0.8"

selfie-enrollment-client = { path = "selfie-enrollment/client" }

selfie-enrollment-host = { path = "selfie-enrollment/host" }
