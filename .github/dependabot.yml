version: 2
updates:
  # Base images are pinned by digest; bumps arrive as reviewed PRs.
  - package-ecosystem: docker
    directories:
      - /migration/api
      - /migration/host
      - /dev/host
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns:
          - "*"

  # Actions are pinned by commit SHA; bumps update the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
