name: Build PCP migration release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ || ${#RELEASE_TAG} -gt 128 ]]; then
            echo "::error::Use a version tag such as v0.1.0 or v0.1.0-rc.1."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag changed after publication."
            exit 1
          fi
          if ! git rev-list --first-parent refs/remotes/origin/main | grep -Fx "$GITHUB_SHA" >/dev/null; then
            echo "::error::The release tag must point to a commit on main."
            exit 1
          fi

  build:
    needs: validate-release
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    uses: ./.github/workflows/build-docker.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ github.event.release.tag_name }}
      push: true
