name: Publish PCP migration to stage
run-name: Publish ${{ inputs.release }} to stage

on:
  workflow_dispatch:
    inputs:
      release:
        description: Published GitHub release tag (for example, v0.1.0)
        type: string
        required: true

permissions: {}

concurrency:
  group: pcp-migration-pcr-release-stage-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_BUCKET: di-migration-pcr-registry-stage-eu-central-1

jobs:
  prepare:
    name: Prepare stage registry for review
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/prepare-pcp-migration-registry.yml
    with:
      release: ${{ inputs.release }}
      target_environment: stage
      registry_bucket: di-migration-pcr-registry-stage-eu-central-1
      aws_account_id: '328681352768'
      reader_role_arn: arn:aws:iam::328681352768:role/oidc/github-biometrics-tee-di-migration-registry-reader

  publish:
    name: Sign and publish approved stage registry
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: di-migration-pcr-release-stage
      url: ${{ needs.prepare.outputs.review_url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.review_id }}
          path: ${{ runner.temp }}/review

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-central-1
          allowed-account-ids: '328681352768'
          role-to-assume: arn:aws:iam::328681352768:role/oidc/github-biometrics-tee-di-migration-release-role

      - name: Publish the approved bytes
        env:
          APPROVED_REVISION: ${{ needs.prepare.outputs.revision }}
          APPROVAL_KEY_ARN: arn:aws:kms:eu-central-1:328681352768:key/3c1b7473-6447-49ab-8cf2-b7e08c031b80
          APPROVAL_KEY_SHA256: '1788c6e062a29f6fa4d95f203b07bc4c810a36255ca70be4c090feeaff93bff6'
        run: |
          set -euo pipefail
          python3 migration/scripts/pcr_registry.py publish --bucket "$REGISTRY_BUCKET" \
            --kms-key-arn "$APPROVAL_KEY_ARN" --expected-key-sha256 "$APPROVAL_KEY_SHA256" \
            --input "$RUNNER_TEMP/review" --expected-revision "$APPROVED_REVISION"
          printf 'Published stage registry `%s`.\n' "$APPROVED_REVISION" >> "$GITHUB_STEP_SUMMARY"
