# Cargo workspace checks. Dependency auditing is supply-chain.yml.
name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cargo-clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # tabernaculum builds Minijail from source; the worker protocol and the PCP
      # builder need protoc, and the PCP builder needs libsodium.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcap-dev clang pkg-config protobuf-compiler libsodium-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --

  cargo-tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # tabernaculum builds Minijail from source; the worker protocol and the PCP
      # builder need protoc, and the PCP builder needs libsodium.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcap-dev clang pkg-config protobuf-compiler libsodium-dev
      - name: Challenge reference vectors
        run: python3 selfie-enrollment/sealed-types/tests/fixtures/challenge_reference.py --check
      - name: tests
        run: cargo test --locked --workspace --all-features --verbose

  localstack:
    name: LocalStack tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb,kms
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install PCP build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config protobuf-compiler libsodium-dev
      - name: API, host, storage and PCP keys against LocalStack
        env:
          LOCALSTACK_ENDPOINT: http://localhost:4566
        run: >-
          cargo test --locked -p migration-api -p di-migration-host
          -p di-migration-storage -p di-migration-enclave
          --test localstack --test pcp_keys -- --ignored

  flake:
    name: Flake eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # --no-update-lock-file: otherwise a new flake.nix input resolves against upstream right
      # now and the lock is quietly rewritten.
      - name: Evaluate the enclave image and converter derivations
        run: |
          set -euo pipefail
          for workload in di-migration di-dev selfie-enrollment; do
            for output in "$workload-enclave" "$workload-oci" "$workload-eif"; do
              drv="$(nix eval --raw --no-update-lock-file ".#packages.x86_64-linux.$output.drvPath")"
              echo "$output -> $drv"
            done
          done
          nix eval --raw --no-update-lock-file .#lib.migrationImages --apply \
            'mk: (mk { pcpKmsKeyArn = "arn:aws:kms:us-east-1:000000000000:alias/example"; }).di-migration-eif.drvPath'
      # Build the OCI images so evaluation-only errors do not slip through. Cheap while no
      # enclave has private dependencies or models; revisit if that changes.
      - name: Build the enclave images
        run: |
          set -euo pipefail
          for workload in di-migration di-dev selfie-enrollment; do
            nix build --no-link --no-update-lock-file ".#packages.x86_64-linux.$workload-oci"
          done

  enrollment:
    name: Enrollment native and browser client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install WASM C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Link browser client and generate bindings
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: |
          cargo build --locked -p selfie-enrollment-client --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          wasm-bindgen --target web --out-dir target/enrollment-web target/wasm32-unknown-unknown/debug/selfie_enrollment_client.wasm
      - name: Install browser test dependencies
        working-directory: selfie-enrollment/e2e/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Verify browser cancellation, bounds and attestation rejection
        run: node selfie-enrollment/e2e/browser/test.cjs
