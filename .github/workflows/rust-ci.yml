# Cargo workspace checks. Dependency auditing is supply-chain.yml.
name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cargo-clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: PCP builder native dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libsodium-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --

  cargo-tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: PCP builder native dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libsodium-dev
      - name: tests
        run: cargo test --locked --workspace --all-features --verbose

  flake:
    name: Flake eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # --no-update-lock-file: otherwise a new flake.nix input resolves against upstream right
      # now and the lock is quietly rewritten.
      - name: Evaluate the enclave image and converter derivations
        run: |
          set -euo pipefail
          for workload in migration dev; do
            for output in "di-$workload-enclave" "di-$workload-oci" "di-$workload-eif"; do
              drv="$(nix eval --raw --no-update-lock-file ".#packages.x86_64-linux.$output.drvPath")"
              echo "$output -> $drv"
            done
          done
      # Build the OCI images so evaluation-only errors do not slip through. Cheap while no
      # enclave has private dependencies or models; revisit if that changes.
      - name: Build the enclave images
        run: |
          set -euo pipefail
          for workload in migration dev; do
            nix build --no-link --no-update-lock-file ".#packages.x86_64-linux.di-$workload-oci"
          done
