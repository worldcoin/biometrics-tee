# Cargo workspace checks. Dependency auditing is supply-chain.yml.
name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cargo-clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # di-sandbox builds Minijail from source.
      - name: Install Minijail build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcap-dev clang pkg-config
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --

  cargo-tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # di-sandbox builds Minijail from source.
      - name: Install Minijail build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcap-dev clang pkg-config
      # The sandbox's process tests need root, so they run separately below.
      - name: tests
        run: cargo test --locked --workspace --all-features --exclude di-sandbox --verbose
      - name: Sandbox tests
        run: cargo test --locked -p di-sandbox
      - name: Minijail process tests
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" cargo test --locked \
            --target x86_64-unknown-linux-gnu -p di-sandbox --all-features --no-run \
            --message-format=json > target/worker-test-artifacts.json
          test_binary=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "process") | .executable // empty' target/worker-test-artifacts.json)
          test -n "$test_binary"
          sudo timeout --kill-after=5s 60s "$test_binary"

  localstack:
    name: LocalStack tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: host and storage against LocalStack
        env:
          LOCALSTACK_ENDPOINT: http://localhost:4566
        run: cargo test --locked -p di-migration-host -p di-migration-storage --test localstack -- --ignored

  flake:
    name: Flake eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # --no-update-lock-file: otherwise a new flake.nix input resolves against upstream right
      # now and the lock is quietly rewritten.
      - name: Evaluate the enclave image and converter derivations
        run: |
          set -euo pipefail
          for workload in migration dev; do
            for output in "di-$workload-enclave" "di-$workload-oci" "di-$workload-eif"; do
              drv="$(nix eval --raw --no-update-lock-file ".#packages.x86_64-linux.$output.drvPath")"
              echo "$output -> $drv"
            done
          done
      # Build the OCI images so evaluation-only errors do not slip through. Cheap while no
      # enclave has private dependencies or models; revisit if that changes.
      - name: Build the enclave images
        run: |
          set -euo pipefail
          for workload in migration dev; do
            nix build --no-link --no-update-lock-file ".#packages.x86_64-linux.di-$workload-oci"
          done
