name: Publish PCP migration to production
run-name: Publish ${{ inputs.release }} to production

on:
  workflow_dispatch:
    inputs:
      release:
        description: Published GitHub release tag (for example, v0.1.0)
        type: string
        required: true

permissions: {}

concurrency:
  group: pcp-migration-pcr-release-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_BUCKET: pcp-migration-pcr-registry-prod-eu-central-1

jobs:
  prepare:
    name: Prepare production registry for review
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/prepare-pcp-migration-registry.yml
    with:
      release: ${{ inputs.release }}
      target_environment: production
      registry_bucket: pcp-migration-pcr-registry-prod-eu-central-1
      aws_account_id: '781493733813'
      reader_role_arn: arn:aws:iam::781493733813:role/oidc/github-biometrics-tee-pcp-migration-registry-reader

  tfh_review:
    name: Review production registry (TFH)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: pcp-migration-pcr-review-prod
      url: ${{ needs.prepare.outputs.review_url }}
    permissions: {}
    steps:
      - name: Record approved registry revision
        env:
          APPROVED_REVISION: ${{ needs.prepare.outputs.revision }}
        run: printf 'TFH approved registry `%s`.\n' "$APPROVED_REVISION" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Sign and publish approved production registry (Foundation)
    needs: [prepare, tfh_review]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pcp-migration-pcr-release-prod
      url: ${{ needs.prepare.outputs.review_url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.review_id }}
          path: ${{ runner.temp }}/review

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-central-1
          allowed-account-ids: '781493733813'
          role-to-assume: arn:aws:iam::781493733813:role/oidc/github-biometrics-tee-pcp-migration-release-role

      - name: Publish the approved bytes
        env:
          APPROVED_REVISION: ${{ needs.prepare.outputs.revision }}
          APPROVAL_KEY_ARN: arn:aws:kms:eu-central-1:767397716933:key/168dede8-ea86-4fd4-8dad-5725e3f5bf21
          APPROVAL_KEY_SHA256: '99f474ca2546ae1d607b2d37b863b216dad8faba1cf04f19cf7cb3008bff0a9f'
        run: |
          set -euo pipefail
          python3 migration/scripts/pcr_registry.py publish --bucket "$REGISTRY_BUCKET" \
            --kms-key-arn "$APPROVAL_KEY_ARN" --expected-key-sha256 "$APPROVAL_KEY_SHA256" \
            --input "$RUNNER_TEMP/review" --expected-revision "$APPROVED_REVISION"
          printf 'Published production registry `%s`.\n' "$APPROVED_REVISION" >> "$GITHUB_STEP_SUMMARY"
