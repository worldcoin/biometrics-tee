# Builds and publishes the host, API and enclave images to GHCR (attested).
#
# Enclave OCI images and EIFs are built reproducibly by flake.nix; the enclave job wraps each
# EIF in the image that launches it beside its host.
name: Build and Push Docker Image

on:
  pull_request:
    paths:
      - "migration/**"
      - "dev/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - ".github/workflows/build-docker.yml"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (including v prefix, e.g. v0.1.0)"
        required: false
        type: string
      push:
        description: "Push images to GHCR."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "Commit to build. Defaults to the calling workflow's ref."
        required: false
        type: string
      version:
        description: "Version tag to publish (including v prefix)."
        required: false
        type: string
      workload:
        description: "Build only this workload's image. Empty builds all."
        required: false
        type: string
      push:
        description: "Push to GHCR. False builds only."
        required: false
        default: true
        type: boolean
    outputs:
      digest:
        description: "Digest of the selected workload's image, when exactly one was built."
        value: ${{ jobs.docker-build.outputs.digest }}
      image:
        description: "Fully-qualified name of that image, so callers need no second copy of the mapping."
        value: ${{ jobs.docker-build.outputs.image }}

permissions:
  contents: read

jobs:
  # A static matrix cannot be filtered by an input, and a caller may need one workload at a
  # time. Cheaper than duplicating the build job per workload.
  resolve-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
      enclaves: ${{ steps.matrix.outputs.enclaves }}
    steps:
      - name: Select workloads
        id: matrix
        env:
          WORKLOAD: ${{ inputs.workload }}
        run: |
          set -euo pipefail
          all='[
            {"name":"di-migration-host","dockerfile":"migration/host/Dockerfile","image":"di-migration-host","workload":"migration"},
            {"name":"di-dev-host","dockerfile":"dev/host/Dockerfile","image":"di-dev-host","workload":"dev"},
            {"name":"di-migration-api","dockerfile":"migration/api/Dockerfile","image":"di-migration-api","workload":"api"}
          ]'
          if [[ -n "${WORKLOAD:-}" ]]; then
            include=$(jq -c --arg w "$WORKLOAD" 'map(select(.workload == $w))' <<<"$all")
            if [[ "$(jq 'length' <<<"$include")" == "0" ]]; then
              echo "::error::No image for workload '$WORKLOAD'." >&2
              exit 1
            fi
          else
            include=$(jq -c . <<<"$all")
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

          # Both sandboxed enclave workloads are packaged in tabernaculum provisioner images.
          enclaves='[
            {"workload":"migration","image":"di-migration-enclave","dockerfile":"scripts/Dockerfile.provisioner"},
            {"workload":"dev","image":"di-dev-enclave","dockerfile":"scripts/Dockerfile.provisioner"}
          ]'
          enclaves=$(jq -c --arg w "${WORKLOAD:-}" 'map(select($w == "" or .workload == $w))' <<<"$enclaves")
          echo "enclaves=$enclaves" >> "$GITHUB_OUTPUT"

  docker-build:
    name: Docker build (${{ matrix.name }})
    needs: resolve-matrix
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.include) }}
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve version
        id: version
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          # `latest` only for stable semver (no -alpha / -rc suffix).
          if [[ "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || steps.version.outputs.is_stable == 'true' }}
            type=sha
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' || inputs.push == true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Publish on push/tag/dispatch; PRs and dry runs build only (validation).
          push: ${{ github.event_name == 'push' || inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.push == true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}

  # Each enclave's launcher image, for tee-apps to deploy beside the host. The EIF is built
  # reproducibly by flake.nix, so its PCRs match a local scripts/build-enclaves.sh run.
  enclave-build:
    name: Enclave build (${{ matrix.image }})
    needs: resolve-matrix
    if: needs.resolve-matrix.outputs.enclaves != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.enclaves) }}
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Prepare Nix store
        run: sudo install -d -m 0755 -o root -g root /nix

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build EIF and measurements
        env:
          STAGING_PCP_KMS_KEY_ARN: ${{ secrets.STAGING_PCP_KMS_KEY_ARN }}
          STAGING_PCP_KMS_SIGNING_KEY_ARN: ${{ secrets.STAGING_PCP_KMS_SIGNING_KEY_ARN }}
        run: scripts/build-enclaves.sh --workload ${{ matrix.workload }} target/eif

      - name: Show measurements
        run: jq . target/eif/di-${{ matrix.workload }}-pcr.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' || inputs.push == true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: target/eif
          file: ${{ matrix.dockerfile }}
          build-args: EIF_FILE=di-${{ matrix.workload }}-enclave.eif
          push: ${{ github.event_name == 'push' || inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.push == true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
