/**
 * Iris-domain operations.
 *
 * The DeepIdentifier migration re-processes the archived IR captures of an Orb signup into
 * the legacy iris code and the DeepIdentifier embedding.
 */
syntax = "proto3";
package biometric_engines.iris.v1;

/*
 * DeepIdentifier migration request for both eyes of one signup.
 *
 * Each eye runs capture QA, the full iris pipeline with its validators, and presentation
 * attack detection. A failure on either eye fails the whole request.
 */
message MigrationRequest {
  IrImage left = 1;
  IrImage right = 2;
}

// One IR capture, PNG-encoded as stored in the PCP (`left_ir.png`, `right_ir.png`).
// The eye side is given by the request field that holds it.
message IrImage {
  bytes png = 1;
}

message MigrationResult {
  EyeResult left = 1;
  EyeResult right = 2;
  string iris_code_version = 3;
  string model_version = 4;
  string embedding_version = 5;
  string inference_backend = 6;
}

message EyeResult {
  // Base64 of the packed template, byte-identical to the Orb's `iris_codes.json` entries.
  string iris_code = 1;
  string mask_code = 2;
  // Int4-quantized DeepIdentifier embedding and its mirror, one value in [-8, 7] per byte.
  bytes embedding = 3;
  bytes mirror_embedding = 4;
  // L2-normalized f32 embedding and its mirror before quantization.
  repeated float embedding_f32 = 5;
  repeated float mirror_embedding_f32 = 6;
}


/*
 * Failure information in case of request processing failures.
 *
 * Failures carry the outcome class only, never scores or thresholds.
 */
message Failure {
  FailureCode code = 1;
  // Required for every code except INTERNAL.
  EyeSide eye = 2;
  // Required exactly when code is INVALID_REQUEST.
  InvalidRequestReason invalid_request_reason = 3;
}

enum FailureCode {
  FAILURE_CODE_UNSPECIFIED = 0;
  FAILURE_CODE_INVALID_REQUEST = 1;
  // The PNG cannot be decoded into an IR capture.
  FAILURE_CODE_INVALID_IMAGE = 2;
  // Capture QA or a pipeline validator rejected the capture.
  FAILURE_CODE_QUALITY_REJECTED = 3;
  // Presentation attack detection flagged the capture.
  FAILURE_CODE_SPOOF_DETECTED = 4;
  FAILURE_CODE_INTERNAL = 5;
}

enum EyeSide {
  EYE_SIDE_UNSPECIFIED = 0;
  EYE_SIDE_LEFT = 1;
  EYE_SIDE_RIGHT = 2;
}

message InvalidRequestReason {
  oneof reason {
    EmptyReason missing_image = 1;
    EmptyReason empty_image = 2;
    ByteLimitExceeded image_too_large = 3;
  }
}

message EmptyReason {}

message ByteLimitExceeded { uint64 limit_bytes = 1; }
