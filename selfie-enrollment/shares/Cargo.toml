[package]
name = "embedding-shares"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Oxide-compatible secret shares of Selfie Check face embeddings"

[dependencies]
ampc-secret-sharing = { git = "https://github.com/worldcoin/ampc-common", rev = "f27c39547b75b6ab7b87dd64c513cc70b003b83a" }
base64.workspace = true
bincode = "1.3.3"
crypto_box = { version = "0.9.1", features = ["seal"] }
curve25519-dalek = { version = "4", default-features = false }
rand.workspace = true
selfie-enrollment-sealed-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize = { workspace = true, features = ["derive"] }
