[package]
name = "selfie-enrollment-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native and browser client for attested TEE-backed selfie enrollment."
homepage.workspace = true
repository.workspace = true

[features]
default = ["js-export"]
js-export = []

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
selfie-enrollment-api-types.workspace = true
selfie-enrollment-sealed-types.workspace = true
pontifex = { workspace = true, features = ["channel", "attestation"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
hex.workspace = true
thiserror.workspace = true
zeroize = { workspace = true, features = ["derive"] }
url.workspace = true
futures-util = { workspace = true, features = ["sink"] }
web-time.workspace = true
rand.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
# NativeTransport supplies its own Rustls connector and root store.
tokio-tungstenite = { workspace = true, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
webpki-roots.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["WebSocket", "MessageEvent", "Event", "BinaryType", "AbortSignal"] }
serde-wasm-bindgen.workspace = true
futures-channel.workspace = true
gloo-timers = { workspace = true, features = ["futures"] }
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
selfie-enrollment-enclave-types.workspace = true
ciborium.workspace = true
coset.workspace = true
p384 = { workspace = true, features = ["ecdsa", "sha384"] }
serde_bytes.workspace = true
