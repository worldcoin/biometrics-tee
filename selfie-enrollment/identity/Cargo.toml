[package]
name = "selfie-enrollment-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Assembles the attested web identity enrollment for one Selfie Check capture"

[dependencies]
base64.workspace = true
crypto_box = "0.9.1"
embedding-shares = { path = "../shares" }
poseidon2 = { package = "taceo-poseidon2", version = "0.3", default-features = false, features = ["bn254", "t16"] }
rand.workspace = true
selfie-enrollment-api-types.workspace = true
selfie-enrollment-sealed-types.workspace = true
sha2.workspace = true
sha3 = { version = "0.10", default-features = false }
thiserror.workspace = true
uuid.workspace = true
world-id-primitives.workspace = true
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true
hex.workspace = true
