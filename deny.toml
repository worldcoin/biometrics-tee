# One policy for the repository's Cargo workspace.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[bans]
multiple-versions = "allow"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "openssl-src" },
]

[advisories]
# The PCP builder pins the legacy Hyrax implementation for commitment compatibility.
# These transitive crates have maintenance notices, with no compatible upgrade.
# Keep vulnerability advisories enforced; remove these exceptions when Hyrax updates.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is used by the pinned Hyrax serialization; changing it requires upstream PCP compatibility validation" },
    { id = "RUSTSEC-2024-0388", reason = "derivative 2.2.0 is a transitive macro dependency of Hyrax/arkworks 0.4; no compatible upstream replacement" },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is a transitive macro dependency of Hyrax/arkworks 0.4; no compatible upstream replacement" },
]

[licenses]
version = 2
confidence-threshold = 1.0
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Reached via webpki-roots, the Mozilla CA bundle rustls uses in the CLI.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
exceptions = [
    # telemetry-batteries uses this public-domain instrumentation helper for HTTP spans.
    { allow = ["CC0-1.0"], name = "tracing-opentelemetry-instrumentation-sdk", version = "0.38.3" },
    # telemetry-batteries reaches option-ext through dirs; MPL's copyleft is file-scoped.
    { allow = ["MPL-2.0"], name = "option-ext", version = "0.2.0" },
    # The AWS SDK reaches foldhash through hashbrown; Zlib is permissive and OSI approved.
    { allow = ["Zlib"], name = "foldhash", version = "0.2.0" },
    # PCP builder libsodium/protobuf build dependencies; all are permissive Zlib.
    { allow = ["Zlib"], name = "foldhash", version = "0.1.5" },
    { allow = ["Zlib"], name = "adler32", version = "1.2.0" },
    { allow = ["Zlib"], name = "zlib-rs", version = "0.6.8" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/worldcoin/orb-software",
    "https://github.com/worldcoin/hyrax-pcs-commit.git",
]
