[package]
name = "di-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The Minijail worker launcher, for enclaves; the host-side bundle transport needs none of it.
worker = ["dep:libc", "dep:minijail"]
test-worker = ["worker"]

[dependencies]
sandbox-bundle.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }
minijail = { workspace = true, optional = true }

[[bin]]
name = "sandbox-test-worker"
path = "tests/support/fake-worker.rs"
required-features = ["test-worker"]
test = false

[[test]]
name = "process"
required-features = ["test-worker"]
harness = false
