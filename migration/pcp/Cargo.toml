[package]
name = "di-migration-pcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
sha2 = "0.10"
# Shared PCP builder and protobuf definitions, pinned to one revision so both
# use the same generated types. This revision supports migration builds.
orb-pcp = { git = "https://github.com/worldcoin/orb-software", rev = "bfeae5eebd43a7ef7714967e61e28b65210fb2db" }
orb-pcp-defs = { git = "https://github.com/worldcoin/orb-software", rev = "bfeae5eebd43a7ef7714967e61e28b65210fb2db" }

[dev-dependencies]
alkali = { version = "0.3", features = ["use-pkg-config"] }
flate2.workspace = true
tar = "0.4"
rand = "0.8"
