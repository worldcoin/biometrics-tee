# Local stand-in for world-id-proof-verification-service.
# POST /api/v4/verify returns 200, which the migration API treats as an accepted proof.
server {
    listen 80;
    server_name _;

    location = /api/v4/verify {
        default_type application/json;
        return 200 '{}';
    }

    location / {
        return 404;
    }
}
