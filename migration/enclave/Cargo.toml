[package]
name = "di-migration-enclave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "di-migration-enclave"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
ark-babyjubjub.workspace = true
alkali.workspace = true
# Without the SDK's default HTTPS client: requests go through `pontifex::kms`.
aws-sdk-kms.workspace = true
aws-types.workspace = true
base64.workspace = true
bytes.workspace = true
di-migration-pcp.workspace = true
di-migration-shares.workspace = true
di-migration-enclave-primitives.workspace = true
di-worker-protocol.workspace = true
flate2.workspace = true
hex.workspace = true
orb-pcp.workspace = true
orb-pcp-defs.workspace = true
pontifex = { workspace = true, features = ["channel", "kms", "nsm", "server"] }
rand.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
world-id-primitives.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tabernaculum.workspace = true

[dev-dependencies]
aws-sdk-kms = { workspace = true, features = ["default-https-client"] }
aws-smithy-runtime-api = { workspace = true, features = ["client", "http-1x"] }
aws-smithy-http-client = { workspace = true, features = ["default-client"] }
aws-smithy-types.workspace = true
http.workspace = true
orb-pcp-defs.workspace = true
tokio = { workspace = true, features = ["test-util"] }
