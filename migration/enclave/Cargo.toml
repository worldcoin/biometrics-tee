[package]
name = "di-migration-enclave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "di-migration-enclave"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
alkali = { version = "0.3", features = ["use-pkg-config"] }
aws-sdk-kms.workspace = true
aws-smithy-types = "1"
base64.workspace = true
bytes.workspace = true
di-migration-pcp = { path = "../pcp" }
di-migration-enclave-primitives.workspace = true
hex.workspace = true
orb-pcp = { git = "https://github.com/worldcoin/orb-software", rev = "81d013e618cdb424bc134b6e68892945ab96ca60" }
pontifex = { workspace = true, features = ["channel", "nsm", "server"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
aws-config.workspace = true
aws-sigv4 = "1"
aws-smithy-async = "1"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
flate2.workspace = true
http = "1"
orb-pcp-defs = { git = "https://github.com/worldcoin/orb-software", rev = "81d013e618cdb424bc134b6e68892945ab96ca60" }
sha2.workspace = true
tar = "0.4"
tokio = { workspace = true, features = ["test-util"] }
