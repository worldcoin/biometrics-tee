[package]
name = "di-migration-enclave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "di-migration-enclave"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
ark-babyjubjub = { version = "0.6", package = "taceo-ark-babyjubjub" }
alkali = { version = "0.3", features = ["use-pkg-config"] }
# Without the SDK's default HTTPS client: requests go through `pontifex::kms`.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-types = "1"
base64.workspace = true
bytes.workspace = true
di-migration-pcp = { path = "../pcp" }
di-migration-shares = { path = "../shares" }
di-migration-enclave-primitives.workspace = true
di-worker-protocol.workspace = true
flate2.workspace = true
hex.workspace = true
orb-pcp.workspace = true
orb-pcp-defs.workspace = true
pontifex = { workspace = true, features = ["channel", "kms", "nsm", "server"] }
rand.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
world-id-primitives.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tabernaculum.workspace = true

[dev-dependencies]
aws-sdk-kms.workspace = true
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
aws-smithy-http-client = { version = "1", features = ["default-client"] }
aws-smithy-types = "1"
http = "1"
orb-pcp-defs.workspace = true
tokio = { workspace = true, features = ["test-util"] }
