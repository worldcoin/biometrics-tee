[package]
name = "di-migration-enclave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "di-migration-enclave"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ark-babyjubjub = { version = "0.5", package = "taceo-ark-babyjubjub" }
alkali = { version = "0.3", features = ["use-pkg-config"] }
aws-sdk-kms.workspace = true
aws-credential-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
http = "1"
http-body-util.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tokio-vsock.workspace = true
base64.workspace = true
bytes.workspace = true
di-migration-pcp = { path = "../pcp" }
di-migration-enclave-primitives.workspace = true
flate2.workspace = true
hex.workspace = true
orb-pcp = { git = "https://github.com/worldcoin/orb-software", rev = "81d013e618cdb424bc134b6e68892945ab96ca60" }
pontifex = { workspace = true, features = ["channel", "nsm", "server"] }
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
world-id-primitives.workspace = true
zeroize.workspace = true

[dev-dependencies]
aws-config.workspace = true
aws-sigv4 = "1"
aws-smithy-async = "1"
rcgen = "0.14"
hyper = { version = "1", features = ["server"] }
orb-pcp-defs = { git = "https://github.com/worldcoin/orb-software", rev = "81d013e618cdb424bc134b6e68892945ab96ca60" }
sha2.workspace = true
tokio = { workspace = true, features = ["test-util"] }
