[package]
name = "di-migration-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes [`MigrationApiClient::with_attested_key_thumbprint`] for tests and local tooling
# that talk to the API without an auth proxy.
test-util = []

[dependencies]
base64.workspace = true
di-migration-enclave-primitives.workspace = true
attested-request.workspace = true
di-migration-primitives.workspace = true
hex.workspace = true
orb-pcp-defs.workspace = true
pontifex = { workspace = true, features = ["attestation", "channel"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sigstore-verify = { version = "=0.16.0", default-features = false, features = ["aws-lc-rs"] }
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
attested-request = { workspace = true, features = ["test-util"] }
axum.workspace = true
